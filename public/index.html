<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Resume Analyzer</title>


  <!-- Icons from font awesome-->
  <!--<script src="https://kit.fontawesome.com/6152a71cae.js" crossorigin="anonymous"></script> -->

  <!-- Google Font for the hero -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app">
    
    <!-- UPLOAD VIEW  -->
    <section id="upload-view" class="hero">

      <!-- decorative floating blobs -->
      <div class="hero-bg">
        <span class="blob b1"></span>
        <span class="blob b2"></span>
        <span class="blob b3"></span>
      </div>

      <!-- glassy upload card -->
      <div class="upload-card glass" role="region" aria-labelledby="hero-heading">

        <h1 id="hero-heading">Instant Resume Analyzer</h1>
        <p class="tagline">
          Upload your PDF and pick an industry - get a tailored score &amp; rewrite tips in seconds.
        </p>

        <!-- DROPZONE -->
        <div id="dropzone" class="dropzone" aria-label="PDF drop zone">
          <input id="fileInput" type="file" accept="application/pdf" hidden />
          <p>Drag &amp; drop PDF here or
             <button id="browseBtn" type="button" class="text-btn">Browse</button>
          </p>
        </div>

        <!-- chosen-file pill -->
        <div id="selectedFileDisplay" class="selected hidden" aria-live="polite">
          <span id="selectedFileName"></span>
          <button id="removeFileBtn" type="button" title="Remove file">✕</button>
        </div>

        <!-- Industry picker -->
        <label for="industrySelect" class="picker-label">Target industry</label>
        <select id="industrySelect" class="picker">
          <option value="Accounting">Accounting & Auditing</option>
          <option value="Advertising">Advertising</option>
          <option value="Aerospace & Defense">Aerospace & Defense</option>
          <option value="Agriculture & Farming">Agriculture & Farming</option>
          <option value="Architecture & Design">Architecture & Design</option>
          <option value="Arts & Culture">Arts & Culture</option>
          <option value="Automotive">Automotive</option>
          <option value="Banking & Financial Services">Banking & Financial Services</option>
          <option value="Biotechnology & Pharmaceuticals">Biotechnology & Pharmaceuticals</option>
          <option value="Chemicals">Chemicals</option>
          <option value="Computer Science">Computer Science</option>
          <option value="Construction">Construction</option>
          <option value="Consumer Goods">Consumer Goods</option>
          <option value="Consulting">Consulting</option>
          <option value="E-commerce">E-commerce</option>
          <option value="Education">Education</option>
          <option value="Electronics & Semiconductors">Electronics & Semiconductors</option>
          <option value="Energy & Utilities">Energy & Utilities</option>
          <option value="Engineering">Engineering</option>
          <option value="Environmental Services">Environmental Services</option>
          <option value="Fashion & Apparel">Fashion & Apparel</option>
          <option value="Finance">Finance</option>
          <option value="Food & Beverage">Food & Beverage</option>
          <option value="Gaming & Esports">Gaming & Esports</option>
          <option value="Government & Public Sector">Government & Public Sector</option>
          <option value="Healthcare">Healthcare</option>
          <option value="Hospitality & Tourism">Hospitality & Tourism</option>
          <option value="Human Resources">Human Resources</option>
          <option value="Information Technology">Information Technology</option>
          <option value="Insurance">Insurance</option>
          <option value="Internet & Web Services">Internet & Web Services</option>
          <option value="Legal">Legal</option>
          <option value="Manufacturing">Manufacturing</option>
          <option value="Maritime & Shipping">Maritime & Shipping</option>
          <option value="Marketing">Marketing</option>
          <option value="Media & Entertainment">Media & Entertainment</option>
          <option value="Mining & Metals">Mining & Metals</option>
          <option value="Nonprofit & NGO">Nonprofit & NGO</option>
          <option value="Property Management">Property Management</option>
          <option value="Psychology & Counseling">Psychology & Counseling</option>
          <option value="Real Estate">Real Estate</option>
          <option value="Renewable Energy">Renewable Energy</option>
          <option value="Research & Development">Research & Development</option>
          <option value="Retail">Retail</option>
          <option value="Sales">Sales</option>
          <option value="Security & Defense">Security & Defense</option>
          <option value="Software Development">Software Development</option>
          <option value="Sports & Recreation">Sports & Recreation</option>
          <option value="Supply Chain">Supply Chain</option>
          <option value="Telecommunications">Telecommunications</option>
          <option value="Transportation & Logistics">Transportation & Logistics</option>
          <option value="Veterinary Services">Veterinary Services</option>
          <option value="Waste Management">Waste Management</option>
          <option value="Water & Sanitation">Water & Sanitation</option>
        </select>

        <!-- action -->
        <button id="analyzeBtn" class="btn-primary" disabled>Analyze</button>
        <div id="spinner" class="hidden spinner"></div>
      </div>
    </section>

    <!-- ░░░ RESULTS (UNCHANGED) ░░░ -->
    <section id="results-view" class="hidden">
      <!-- Add decorative blobs to results page -->
      <div class="hero-bg">
        <span class="blob b1"></span>
        <span class="blob b2"></span>
        <span class="blob b3"></span>
      </div>

      <div id="scoresPanel"></div>

      <div class="pane-container">
        <div class="pane">
          <h3>Original</h3>
          <div id="pdfOriginal" class="pdf-scroll"></div>
          <!-- <i class="fa-regular fa-pen-to-square" style="font-size:60px;color:black;"></i> -->

        </div>
        <div class="pane">
          <h3>Improved Draft</h3>
          <div id="improvedText" class="improved-box"></div>
        </div>
      </div>

      <div id="detailsTabs"></div>

    </section>
  </main>

  <!-- PDF.js + app scripts (unchanged) -->
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist/build/pdf.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdn.jsdelivr.net/npm/pdfjs-dist/build/pdf.worker.js";
  </script>
  <script src="pdfviewer.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
